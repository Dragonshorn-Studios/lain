name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify the tag matches package.json
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            printf '::error::tag v%s does not match package.json version %s\n' "$tag_version" "$package_version"
            exit 1
          fi
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Build the source tarball and checksum manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="lain-${version}/" --output="dist/lain-${version}.tar.gz" "$GITHUB_REF_NAME"
          (cd dist && sha256sum "lain-${version}.tar.gz" > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Lain ${GITHUB_REF_NAME}" \
            --generate-notes \
            "dist/lain-${version}.tar.gz" dist/SHA256SUMS
